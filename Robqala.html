<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>روبقالة</title>
<style>
  :root {
    --bg: #ded9c3;
    --panel: #eae5d3;
    --user-bubble: #d6e8c9;
    --bot-bubble: #f7f0c4;
    --text: #3a352a;
    --accent: #8a7a4e;
    --border: #c9c2a8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    font-family: "Tahoma", "Segoe UI", sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    height: 100vh;
  }

  .app {
    width: 100%;
    max-width: 640px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header .title {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 0.5px;
  }

  header .subtitle {
    font-size: 12px;
    color: var(--accent);
    margin-top: 2px;
  }

  #clearBtn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  #clearBtn:hover { background: var(--bg); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-left-radius: 4px;
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border-bottom-right-radius: 4px;
  }

  .msg.system {
    align-self: center;
    background: transparent;
    color: #9a4b3a;
    font-size: 13px;
    text-align: center;
  }

  .typing {
    align-self: flex-start;
    background: var(--bot-bubble);
    padding: 10px 14px;
    border-radius: 14px;
    border-bottom-right-radius: 4px;
    font-size: 14px;
    color: var(--accent);
  }

  form {
    display: flex;
    gap: 8px;
    padding: 16px;
    border-top: 1px solid var(--border);
  }

  #input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 15px;
    background: #fff;
    color: var(--text);
    font-family: inherit;
  }
  #input:focus { outline: 2px solid var(--accent); }

  #sendBtn {
    padding: 0 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  #sendBtn:hover { opacity: 0.9; }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <div class="title">روبقالة</div>
      <div class="subtitle">مساعد التسوق </div>
    </div>
    <button id="clearBtn">مسح المحادثة</button>
  </header>

  <div id="chat"></div>

  <form id="chatForm">
    <input id="input" type="text" placeholder="اكتب رسالتك هنا..." autocomplete="off" />
    <button id="sendBtn" type="submit">إرسال</button>
  </form>
</div>

<script>
const chatEl = document.getElementById("chat");
const form = document.getElementById("chatForm");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const clearBtn = document.getElementById("clearBtn");

const OLLAMA_URL = "http://localhost:11434/api/chat";
const MODEL_NAME = "robqala";

let history = [];

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addSystemNote(text) {
  const div = document.createElement("div");
  div.className = "msg system";
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "typing";
  div.id = "typingIndicator";
  div.textContent = "روبقالة يكتب...";
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

async function sendMessage(userText) {
  history.push({ role: "user", content: userText });
  addMessage("user", userText);
  input.value = "";
  sendBtn.disabled = true;
  showTyping();

  try {
    const response = await fetch(OLLAMA_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: MODEL_NAME,
        messages: history,
        stream: false
      })
    });

    if (!response.ok) {
      throw new Error("Ollama responded with status " + response.status);
    }

    const data = await response.json();
    const reply = data.message?.content || "(لا يوجد رد)";

    removeTyping();
    history.push({ role: "assistant", content: reply });
    addMessage("bot", reply);

  } catch (err) {
    removeTyping();
    addSystemNote(
      "تعذر الاتصال بـ Ollama. تأكدي إن Ollama شغال على جهازك، وإن النموذج (robqala) موجود، وإن الاتصال مسموح من المتصفح (OLLAMA_ORIGINS)."
    );
    console.error(err);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  sendMessage(text);
});

clearBtn.addEventListener("click", () => {
  history = [];
  chatEl.innerHTML = "";
  addSystemNote("تم مسح المحادثة.");
});
</script>

</body>
</html>
